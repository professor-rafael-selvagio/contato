<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Rafael Selvagio</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Decorative background blobs for glassmorphism effect */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 1;
            opacity: 0.6;
            animation: float 10s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: #4f46e5;
            top: -50px;
            left: -50px;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: #7c3aed;
            bottom: -100px;
            right: -50px;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            background: #db2777;
            top: 40%;
            left: 75%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
            z-index: 10;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }

        /* Profile & Info Column */
        .profile-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 40px;
        }

        .profile-img-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title {
            font-size: 1rem;
            color: #a5b4fc;
            font-weight: 400;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 35px;
            color: #e2e8f0;
        }

        /* Social/Contact Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-link {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #f1f5f9;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .contact-link i {
            font-size: 1.2rem;
            margin-right: 15px;
            width: 24px;
            text-align: center;
        }

        .contact-link.linkedin i { color: #0a66c2; }
        .contact-link.github i { color: #f0f6fc; }
        .contact-link.email1 i { color: #ea4335; }
        .contact-link.email2 i { color: #34a853; }

        .contact-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        /* Form Column */
        .form-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-side h2 {
            color: #fff;
            font-size: 1.6rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 400;
            padding-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }

        textarea.form-input {
            resize: none;
            min-height: 130px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.35);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Success Message Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #22c55e, #10b981);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }

        .modal-card h3 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #34d399, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-card p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .modal-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Responsive Layout */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 30px 24px;
            }

            .profile-side {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding-right: 0;
                padding-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Glassmorphic Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Main Card -->
    <div class="container">
        
        <!-- Left Side: Profile and Links -->
        <section class="profile-side">
            <div class="profile-img-container">
                <img src="Rafael.jpeg" alt="Rafael Selvagio" class="profile-img">
            </div>
            
            <h1 class="name">Rafael Selvagio</h1>
            <p class="title">Instrutor de Formação Profissional</p>
            <p class="tagline">"Vamos construir algo incrível juntos?"</p>
            
            <div class="links-container">
                <a href="https://www.linkedin.com/in/rafaelselvagio/" target="_blank" class="contact-link linkedin">
                    <i class="fa-brands fa-linkedin"></i> LinkedIn
                </a>
                <a href="https://github.com/professor-rafael-selvagio" target="_blank" class="contact-link github">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <a href="mailto:professor.rafael.selvagio@gmail.com" class="contact-link email1">
                    <i class="fa-solid fa-envelope"></i> E-mail (Pessoal)
                </a>
                <a href="mailto:rafael.selvagio@docente.senai.br" class="contact-link email2">
                    <i class="fa-solid fa-graduation-cap"></i> E-mail (SENAI)
                </a>
            </div>
        </section>

        <!-- Right Side: Contact Form (Integrated with Formspree) -->
        <section class="form-side">
            <h2>Mande uma mensagem</h2>

            <form action="https://formspree.io/f/xzdqbboa" method="POST" id="contact-form">
                <!-- Campo dinâmico para onde o Formspree irá redirecionar após o envio -->
                <input type="hidden" name="_next" id="next-field">
                
                <div class="form-group">
                    <label class="form-label" for="name">Seu Nome</label>
                    <input class="form-input" type="text" id="name" name="name" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Seu E-mail</label>
                    <input class="form-input" type="email" id="email" name="_replyto" placeholder="Ex: joao@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="message">Mensagem</label>
                    <textarea class="form-input" id="message" name="message" placeholder="Como posso te ajudar?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Enviar Mensagem <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </section>

    </div>

    <!-- Success Message Modal Overlay -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3>Mensagem Enviada!</h3>
            <p>Obrigado pelo contato, Rafael. <br>Sua mensagem foi recebida com sucesso e responderei em breve.</p>
            <button class="modal-btn" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <!-- JavaScript code to handle dynamic redirect URL and capture parameter -->
    <script>
        // 1. Define dinamicamente a URL atual + o parâmetro de sucesso para o Formspree saber para onde retornar
        // Isso funciona perfeitamente independente se rodar local ou no GitHub Pages
        const currentUrl = window.location.href.split('?')[0]; 
        document.getElementById('next-field').value = currentUrl + '?success=true';

        // 2. Verifica na URL se existe o parâmetro de sucesso ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const modal = document.getElementById('success-modal');
                modal.classList.add('active');
            }
        });

        // 3. Função para fechar o modal e limpar o parâmetro da URL de forma elegante
        function closeModal() {
            const modal = document.getElementById('success-modal');
            modal.classList.remove('active');
            
            // Remove o "?success=true" da URL sem recarregar a página inteira
            const cleanUrl = window.location.href.split('?')[0];
            window.history.replaceState({}, document.title, cleanUrl);
        }
    </script>

</body>
</html>
